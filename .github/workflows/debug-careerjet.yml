name: debug-careerjet
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          K=3a2af9adbb2ecac917643cb1cfbcdbcd
          IP=$(curl -s https://api.ipify.org)
          echo "runner ip: $IP"
          curl -4 -s -m 20 -w "\nHTTP %{http_code}\n" \
            -u "$K:" \
            -H "Referer: https://jobscout.local/find-jobs/" \
            "https://search.api.careerjet.net/v4/query?locale_code=en_IN&keywords=devops+engineer&location=India&sort=date&page_size=5&user_ip=$IP&user_agent=jobscout/1.0" | head -c 700
